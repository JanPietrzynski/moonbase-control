<h2>{{ greeting() }}</h2>
<p>Here's what's happening on the moonbase.</p>

<section class="status-container">
  <app-card [status]="totalMissions.title" [quantity]="totalMissions.value"></app-card>
  <app-card [status]="activeMissions.title" [quantity]="activeMissions.value"></app-card>
  <app-card [status]="openIncidents.title" [quantity]="openIncidents.value"></app-card>
  <app-card [status]="criticalIncidents.title" [quantity]="criticalIncidents.value"></app-card>
</section>
